name: Atualizar oportunidades

on:
  schedule:
    - cron: '0 7 * * *'   # todos os dias às 07:00 UTC (~08:00 em Portugal continental)
  workflow_dispatch: {}     # permite correr manualmente no separador Actions

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Recolher oportunidades
        run: python scripts/coletar.py

      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/oportunidades.json
          git diff --staged --quiet || git commit -m "Atualização automática de oportunidades"
          git push
